<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIJAYA AC – Content Engine</title>
<style>
body{font-family:Arial;background:#f4f8fb;margin:0;padding:15px;color:#333}
header{background:#0b5ed7;color:#fff;padding:16px;border-radius:14px}
.card{background:#fff;border-radius:14px;padding:15px;margin-top:15px}
button{width:100%;padding:12px;border:none;border-radius:12px;background:#0b5ed7;color:#fff;font-size:15px;margin-top:8px}
select,input{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin-top:6px}
canvas{width:100%;border-radius:14px;background:#eee}
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.asset-grid img{width:100%;border-radius:10px;border:1px solid #ccc}
.badge{background:#0b5ed7;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
</style>
</head>

<body>

<header>
  <h2>WIJAYA AC</h2>
  <p>Offline Content Engine – Asset Manager</p>
</header>

<div class="card">
  <span class="badge" id="tanggal"></span>
  <h3 id="tema"></h3>
</div>

<div class="card">
  <h4>📂 Asset Manager (Offline)</h4>
  <input type="file" accept="image/*" onchange="uploadAsset(event)">
  <select id="assetCategory">
    <option value="ac">Icon AC</option>
    <option value="technician">Teknisi</option>
    <option value="general">Umum / Default</option>
  </select>
  <div class="asset-grid" id="assetPreview"></div>
</div>

<div class="card">
  <h4>🎨 Auto Design</h4>
  <canvas id="designCanvas" width="1080" height="1080"></canvas>
  <button onclick="generateDesign()">Generate Gambar</button>
</div>

<script>
// ===== DATE & THEME =====
const today=new Date(),dd=String(today.getDate()).padStart(2,'0'),
mm=String(today.getMonth()+1).padStart(2,'0'),yyyy=today.getFullYear();
document.getElementById("tanggal").innerText=`${dd}/${mm}/${yyyy}`;
const temaList=[
 "AC Cepat Rusak? Ini Penyebabnya",
 "Tips Agar AC Lebih Awet",
 "Proses Service AC yang Benar",
 "AC Kurang Dingin? Jangan Abaikan Ini"
];
const tema=temaList[Math.floor(Math.random()*temaList.length)];
document.getElementById("tema").innerText=tema;

// ===== ASSET STORAGE =====
const STORAGE_KEY="wijaya_assets";
let assets=JSON.parse(localStorage.getItem(STORAGE_KEY))||{ac:[],technician:[],general:[]};

function uploadAsset(e){
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  const cat=document.getElementById("assetCategory").value;
  assets[cat].push(reader.result);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(assets));
  renderAssets();
 };
 reader.readAsDataURL(file);
}

function renderAssets(){
 const grid=document.getElementById("assetPreview");
 grid.innerHTML="";
 Object.values(assets).flat().forEach(img=>{
  const i=document.createElement("img");
  i.src=img;
  grid.appendChild(i);
 });
}
renderAssets();

// ===== PICK ASSET BY THEME =====
function pickAsset(){
 const t=tema.toLowerCase();
 if(t.includes("service")||t.includes("proses")) return randomAsset("technician");
 if(t.includes("tips")||t.includes("penyebab")) return randomAsset("ac");
 return randomAsset("general")||randomAsset("ac");
}

function randomAsset(cat){
 const arr=assets[cat];
 if(!arr||arr.length===0)return null;
 return arr[Math.floor(Math.random()*arr.length)];
}

// ===== DESIGN =====
function generateDesign(){
 const c=document.getElementById("designCanvas"),ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);

 ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle="#0b5ed7";ctx.fillRect(0,0,c.width,180);
 ctx.fillStyle="#fff";ctx.font="bold 42px Arial";
 ctx.fillText("WIJAYA AC • Solusi AC Terpercaya",60,110);

 ctx.fillStyle="#0b5ed7";ctx.font="bold 72px Arial";
 wrapText(ctx,tema,60,320,960,84);

 ctx.fillStyle="#333";ctx.font="36px Arial";
 ctx.fillText("Tips & Edukasi Perawatan AC",60,520);

 const imgSrc=pickAsset();
 if(imgSrc){
  const img=new Image();
  img.src=imgSrc;
  img.onload=()=>ctx.drawImage(img,60,600,220,220);
 }

 ctx.fillStyle="#f4f8fb";ctx.fillRect(0,820,c.width,260);
 ctx.fillStyle="#0b5ed7";ctx.font="bold 42px Arial";
 ctx.fillText("Butuh perawatan atau perbaikan AC?",60,900);
 ctx.font="bold 48px Arial";
 ctx.fillText("Hubungi 0811-8011-436",60,970);
}

function wrapText(ctx,text,x,y,max,line){
 const words=text.split(" ");let l="";
 for(let i=0;i<words.length;i++){
  const test=l+words[i]+" ";
  if(ctx.measureText(test).width>max&&i>0){
   ctx.fillText(l,x,y);l=words[i]+" ";y+=line;
  }else l=test;
 }
 ctx.fillText(l,x,y);
}
</script>

</body>
</html>
